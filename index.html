<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store | Premium Quality Online Shopping</title>
    <meta name="description" content="Explore our collection of authentic, premium products with seamless shopping and fast delivery." />
    <meta name="theme-color" content="#0a3866" />
    
    <!-- Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://assets.mixkit.co" crossorigin />
    
    <!-- Brand Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Store" />
    <meta property="og:title" content="Store | Premium Quality Online Shopping" />
    <meta property="og:description" content="Explore our collection of authentic, premium products with seamless shopping and fast delivery." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Store | Premium Quality Online Shopping" />
    <meta name="twitter:description" content="Explore our collection of authentic, premium products with seamless shopping and fast delivery." />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Store",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-[#faf9f6] text-slate-900 antialiased selection:bg-rose-100 selection:text-rose-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
